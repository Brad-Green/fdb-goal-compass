name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: read

jobs:
  unit:
    name: Lint, type-check, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Debug packages auth
        run: |
          echo "token length: ${#GITHUB_TOKEN}"
          echo ".npmrc:"
          cat .npmrc
          echo "---"
          echo "HEAD probe:"
          curl -sI -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://npm.pkg.github.com/download/@brad-green/tokens/1.0.3/d9cd50b3fc4a81d5d37292b7521ca9162ece874a" | head -10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # .npmrc reads ${GITHUB_TOKEN} for the @brad-green scope
          # hosted on GitHub Packages (npm.pkg.github.com).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: pnpm lint

      - name: Type-check + build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:run

  e2e:
    name: Playwright E2E + visual + axe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # .npmrc reads ${GITHUB_TOKEN} for the @brad-green scope
          # hosted on GitHub Packages (npm.pkg.github.com).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run Playwright tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright test-results (failures, new baselines)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

      - name: Upload generated snapshot baselines (first-run bootstrap)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-snapshots
          path: e2e/**-snapshots/**
          retention-days: 14
          if-no-files-found: ignore
